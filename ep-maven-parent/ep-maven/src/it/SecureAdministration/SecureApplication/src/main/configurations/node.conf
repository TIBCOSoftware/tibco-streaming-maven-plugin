//
// Put Node1's administration listener on a secure communication profile that also requires client
// authentication. CREDS_DIR is substituted at install time; prebuild.groovy generates the stores.
//
name = "secure-administration-node"
version = "1.0.0"
type = "com.tibco.ep.dtm.configuration.node"
configuration = {
    NodeDeploy = {
        globalConfiguration = [
            """
            name = "secure-administration-profile"
            version = "1.0.0"
            type = "com.tibco.ep.dtm.configuration.security"
            configuration = {
                SecureCommunicationServerProfile = {
                    name = "secure-administration"
                    keyStore = "${CREDS_DIR}/keystore.p12"
                    keyStorePassword = "secret"
                    keyStoreType = "PKCS12"
                    trustStore = "${CREDS_DIR}/truststore.p12"
                    trustStorePassword = "secret"
                    trustStoreType = "PKCS12"
                    requireClientAuthentication = true
                }
            }
            """
        ]
        nodes = {
            "Node1.secure_cluster" = {
                engines = {
                    SecureEventFlow = {
                        fragmentIdentifier = "com.tibco.test.SecureEventFlow"
                    }
                }
                communication = {
                    secureCommunicationProfileName = "secure-administration"
                }
            }
        }
    }
}
